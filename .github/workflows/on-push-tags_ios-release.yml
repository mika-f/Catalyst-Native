name: Publish iOS IPA

on:
  # push:
  #   tags:
  #     - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'mika-f/Catalyst-Native'
    name: Build and Publish iOS App
    runs-on: macos-latest
    concurrency:
      group: ios-build
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: ".node-version"
          registry-url: "https://registry.npmjs.org"

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: "10"

      - name: Setup Expo
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # 9.0.0
        with:
          expo-version: latest
          eas-version: latest
          packager: pnpm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "26.4"

      - name: ☕️ Setup Cocoapods
        uses: maxim-lobanov/setup-cocoapods@8e97e1e98e6ccf42564fdf5622c8feec74199377 # v1.4.0
        with:
          version: 1.16.2

      - name: Write Environment Values
        run: |
          echo "EXPO_PUBLIC_CATALYST_FOR_ANDROID_CLIENT_ID=" >> .env.local
          echo "EXPO_PUBLIC_CATALYST_FOR_ANDROID_CLIENT_SECRET=" >> .env.local
          echo "EXPO_PUBLIC_CATALYST_FOR_IOS_CLIENT_ID=${{ secrets.CATALYST_FOR_IOS_CLIENT_ID }}" >> .env.local
          echo "EXPO_PUBLIC_CATALYST_FOR_IOS_CLIENT_SECRET=${{ secrets.CATALYST_FOR_IOS_CLIENT_SECRET }}" >> .env.local
          echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}" > GoogleService-Info.plist

      - name: Build package
        run: |
          EXPO_NO_CAPABILITY_SYNC=1 SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }} pnpm run build:ios:production --non-interactive --output=./dist/app.ipa

      # - name: Publish to EAS
      #   run: |
      #     pnpm run submit:ios:production --non-interactive --path ./dist/app.ipa
